spring:
  application:
    name: security

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/ORCLCDB}
    username: ${DB_USERNAME:security_user}
    password: ${DB_PASSWORD:security_pass}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      pool-name: SecurityHikariPool

  jpa:
    hibernate:
      ddl-auto: none          # Liquibase owns schema management
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_size: 25

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

# ─── Application-specific JWT & security settings ───────────────────────────
app:
  security:
    jwt:
      # Minimum 32 characters (256 bits) for HMAC-SHA-256. Override via env var in prod.
      secret: ${JWT_SECRET:5ecur1ty-m0dule-secret-key-32ch}
      # Access token lifetime in milliseconds (default: 1 hour)
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
      # Refresh token lifetime in milliseconds (default: 7 days)
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.company.security: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN